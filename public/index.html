<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lingle</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: #0b1416; color: #fff; display: flex; justify-content: center; height: 100vh; margin: 0; }
        #app { width: 100%; max-width: 500px; height: 100vh; background: #0b1416; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        
        /* Авторизация */
        #auth-container { display: flex; flex: 1; flex-direction: column; justify-content: center; align-items: center; padding: 30px; }
        #auth-box { width: 100%; max-width: 350px; background: #1e2a2e; padding: 30px; border-radius: 16px; display: flex; flex-direction: column; gap: 15px; }
        #auth-box h2 { text-align: center; margin-bottom: 10px; }
        #auth-box input { background: #2a3942; border: none; padding: 12px; border-radius: 8px; color: #fff; font-size: 16px; width: 100%; outline: none; }
        #auth-box button { background: #4caf50; border: none; padding: 12px; border-radius: 8px; color: #fff; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        #auth-box .toggle { background: transparent; color: #8696a0; border: none; padding: 10px; cursor: pointer; font-size: 14px; text-align: center; width: 100%; }
        #auth-box .error { color: #ff4d4d; text-align: center; font-size: 14px; margin-top: -10px; }

        /* Список чатов (главная) */
        #chats-container { display: none; flex: 1; flex-direction: column; }
        #chats-header { padding: 12px 15px; background: #1e2a2e; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a3942; }
        #chats-header h2 { font-weight: 600; font-size: 20px; }
        #chats-header input { background: #2a3942; border: none; padding: 6px 12px; border-radius: 20px; color: #fff; font-size: 14px; width: 120px; outline: none; }
        
        #chat-list { flex: 1; overflow-y: auto; padding: 8px 0; }
        #chat-list::-webkit-scrollbar { width: 4px; }
        #chat-list::-webkit-scrollbar-thumb { background: #2a3942; border-radius: 4px; }
        
        .chat-item { display: flex; padding: 12px 16px; border-bottom: 1px solid #1e2a2e; cursor: pointer; transition: 0.1s; }
        .chat-item:active { background: #1e2a2e; }
        .chat-item .info { flex: 1; }
        .chat-item .info h4 { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
        .chat-item .info p { font-size: 14px; color: #8696a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Окно чата (сама переписка) */
        #chat-window { display: none; flex: 1; flex-direction: column; }
        #chat-header { padding: 10px 15px; background: #1e2a2e; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #2a3942; }
        #chat-header .back { background: transparent; border: none; color: #fff; font-size: 22px; cursor: pointer; }
        #chat-header .name { font-weight: 600; font-size: 16px; }
        #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { display: flex; width: 100%; margin-bottom: 4px; }
        .msg-content { max-width: 80%; padding: 8px 12px; border-radius: 8px; position: relative; word-wrap: break-word; }
        .msg.self { justify-content: flex-end; }
        .msg.self .msg-content { background: #4caf50; color: #fff; border-top-right-radius: 0; }
        .msg.other { justify-content: flex-start; }
        .msg.other .msg-content { background: #2a3942; color: #fff; border-top-left-radius: 0; }
        .msg .username { font-weight: bold; font-size: 13px; color: #4caf50; display: block; margin-bottom: 2px; }
        .msg .text { font-size: 15px; line-height: 1.4; }
        .msg .time { font-size: 11px; color: #8696a0; float: right; margin-top: 4px; margin-left: 8px; }

        #input-area { display: flex; padding: 10px 15px; background: #1e2a2e; gap: 10px; align-items: center; border-top: 1px solid #2a3942; }
        #msgInput { flex: 1; background: #2a3942; border: none; padding: 10px 15px; border-radius: 20px; color: #fff; outline: none; font-size: 15px; }
        #sendBtn { background: #4caf50; border: none; width: 45px; height: 45px; border-radius: 50%; color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        /* Звонки */
        #call-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 20; justify-content: center; align-items: center; flex-direction: column; }
        #call-box { background: #1a1a1a; width: 90%; max-width: 400px; border-radius: 24px; padding: 20px; text-align: center; display: flex; flex-direction: column; gap: 10px; position: relative; }
        #call-box video { width: 100%; max-height: 200px; background: #000; border-radius: 12px; object-fit: cover; }
        #call-box #local-video { width: 100px; height: 80px; position: absolute; bottom: 80px; right: 20px; border: 2px solid #4caf50; z-index: 21; border-radius: 12px; }
        #call-box .call-info { font-size: 18px; font-weight: 600; }
        #call-box .call-buttons { display: flex; gap: 16px; justify-content: center; }
        #call-box .call-buttons button { padding: 14px 24px; border: none; border-radius: 50%; font-size: 24px; cursor: pointer; }
        #call-box .btn-end { background: #e74c3c; color: #fff; }
        #call-box .btn-answer { background: #4caf50; color: #fff; }
    </style>
</head>
<body>
<div id="app">
    <!-- Вход / Регистрация -->
    <div id="auth-container">
        <div id="auth-box">
            <h2 id="auth-title">Lingle</h2>
            <input type="email" id="auth-email" placeholder="Email">
            <input type="password" id="auth-password" placeholder="Пароль">
            <input type="text" id="reg-username" placeholder="Имя пользователя" style="display: none;">
            <div class="error" id="auth-error"></div>
            <button id="auth-btn">Войти</button>
            <button class="toggle" id="auth-toggle">Нет аккаунта? Зарегистрироваться</button>
        </div>
    </div>

    <!-- Список чатов (главная) -->
    <div id="chats-container">
        <div id="chats-header">
            <h2>Чаты</h2>
            <input type="text" id="search-users" placeholder="Найти людей...">
        </div>
        <div id="chat-list"></div>
    </div>

    <!-- Окно переписки (открывается при клике на чат) -->
    <div id="chat-window">
        <div id="chat-header">
            <button class="back" id="backBtn">‹</button>
            <div class="name" id="current-chat-name">...</div>
            <div style="flex:1; text-align:right; gap:10px; display:flex; justify-content:flex-end;">
                <button id="audio-call-btn" style="background:transparent; border:none; color:#fff; font-size:20px; cursor:pointer;">🎧</button>
                <button id="video-call-btn" style="background:transparent; border:none; color:#fff; font-size:20px; cursor:pointer;">📹</button>
            </div>
        </div>
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="msgInput" placeholder="Сообщение...">
            <button id="sendBtn">➤</button>
        </div>
    </div>

    <!-- Окно звонка -->
    <div id="call-overlay">
        <div id="call-box">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
            <div class="call-info" id="call-status">Звонок...</div>
            <div class="call-buttons">
                <button id="call-end-btn" class="btn-end">📞</button>
                <button id="call-answer-btn" class="btn-answer" style="display:none;">✅</button>
            </div>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    // --- Авторизация ---
    const authContainer = document.getElementById('auth-container');
    const authEmail = document.getElementById('auth-email');
    const authPassword = document.getElementById('auth-password');
    const regUsername = document.getElementById('reg-username');
    const authBtn = document.getElementById('auth-btn');
    const authToggle = document.getElementById('auth-toggle');
    const authError = document.getElementById('auth-error');

    let isLoginMode = true;
    let socket = null;
    let currentUserId = null;

    authToggle.onclick = () => {
        isLoginMode = !isLoginMode;
        if (isLoginMode) {
            document.getElementById('auth-title').textContent = 'Lingle';
            authBtn.textContent = 'Войти';
            regUsername.style.display = 'none';
            authToggle.textContent = 'Нет аккаунта? Зарегистрироваться';
        } else {
            document.getElementById('auth-title').textContent = 'Регистрация Lingle';
            authBtn.textContent = 'Зарегистрироваться';
            regUsername.style.display = 'block';
            authToggle.textContent = 'Уже есть аккаунт? Войти';
        }
        authError.textContent = '';
    };

    authBtn.onclick = async () => {
        const email = authEmail.value.trim();
        const password = authPassword.value.trim();
        const username = regUsername.value.trim();
        if (!email || !password) return authError.textContent = 'Заполните поля!';
        if (!isLoginMode && !username) return authError.textContent = 'Придумайте имя!';

        const url = isLoginMode ? '/api/login' : '/api/register';
        const body = isLoginMode ? { email, password } : { email, password, username };

        try {
            const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Ошибка');
            localStorage.setItem('token', data.token);
            startApp();
        } catch (err) { authError.textContent = err.message; }
    };

    // --- Запуск приложения ---
    function startApp() {
        authContainer.style.display = 'none';
        const token = localStorage.getItem('token');
        socket = io({ auth: { token } });
        socket.on('your_id', (id) => { currentUserId = id; });
        loadChats();
    }

    // --- Загрузка списка диалогов ---
    async function loadChats() {
        const token = localStorage.getItem('token');
        const res = await fetch('/api/my-chats', { headers: { 'Authorization': 'Bearer ' + token } });
        const chats = await res.json();
        renderChats(chats);
    }

    function renderChats(chats) {
        const list = document.getElementById('chat-list');
        list.innerHTML = '';
        chats.forEach(chat => {
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.innerHTML = `
                <div class="info">
                    <h4>${chat.target_username}</h4>
                    <p>${chat.last_message || 'Начните чат...'}</p>
                </div>
            `;
            div.onclick = () => openChat(chat.chat_room_id, chat.target_user_id, chat.target_username);
            list.appendChild(div);
        });
        document.getElementById('chats-container').style.display = 'flex';
    }

    // --- Открытие чата ---
    function openChat(roomId, targetId, targetUsername) {
        document.getElementById('chats-container').style.display = 'none';
        document.getElementById('chat-window').style.display = 'flex';
        document.getElementById('current-chat-name').textContent = targetUsername;
        document.getElementById('messages').innerHTML = '';
        socket.emit('join_room', roomId, targetId, targetUsername);
        socket.once('load_history', (msgs) => msgs.forEach(addMessage));
    }

    // --- Кнопка "Назад" к списку чатов ---
    document.getElementById('backBtn').onclick = () => {
        document.getElementById('chat-window').style.display = 'none';
        document.getElementById('chats-container').style.display = 'flex';
        loadChats(); // перезагружаем список, чтобы обновить последнее сообщение
    };

    // --- Сообщения ---
    function addMessage(msg) {
        const div = document.createElement('div');
        div.className = `msg ${socket && msg.user_id === socket.userId ? 'self' : 'other'}`;
        let timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        if (msg.time) {
            const date = new Date(msg.time);
            if (!isNaN(date)) timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        div.innerHTML = `<div class="msg-content"><span class="username">${msg.username}</span><div class="text">${msg.text}</div><span class="time">${timeStr}</span></div>`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        
        // Обновляем последнее сообщение в списке (если мы в чате, оно обновится при выходе)
        if (socket && msg.user_id !== socket.userId) {
            // Можно сохранить в localStorage, но мы просто перезагрузим список при выходе
        }
    }

    document.getElementById('sendBtn').onclick = () => {
        const roomId = document.getElementById('current-chat-name').dataset.roomId || '1'; // fallback
        const text = document.getElementById('msgInput').value.trim();
        if (!text || !socket) return;
        socket.emit('send_message', { roomId: roomId, text });
        document.getElementById('msgInput').value = '';
    };
    document.getElementById('msgInput').onkeypress = (e) => { if (e.key === 'Enter') document.getElementById('sendBtn').click(); };

    // --- Поиск людей ---
    document.getElementById('search-users').addEventListener('input', async (e) => {
        const query = e.target.value.trim();
        if (query.length < 1) return loadChats();
        const token = localStorage.getItem('token');
        const res = await fetch(`/api/search-users?q=${encodeURIComponent(query)}`, { headers: { 'Authorization': 'Bearer ' + token } });
        const users = await res.json();
        
        const list = document.getElementById('chat-list');
        list.innerHTML = '';
        users.forEach(user => {
            if (user.id === currentUserId) return; // не показываем себя
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.innerHTML = `<div class="info"><h4>${user.username}</h4><p>${user.email}</p></div>`;
            div.onclick = () => {
                const roomId = `chat_${Math.min(currentUserId, user.id)}_${Math.max(currentUserId, user.id)}`;
                openChat(roomId, user.id, user.username);
                document.getElementById('search-users').value = '';
            };
            list.appendChild(div);
        });
    });

    // --- Звонки (WebRTC) ---
    let pc = null, localStream = null, remoteSocketId = null, isCaller = false;
    const callOverlay = document.getElementById('call-overlay');
    const callStatus = document.getElementById('call-status');
    const localVideo = document.getElementById('local-video');
    const remoteVideo = document.getElementById('remote-video');
    const callEndBtn = document.getElementById('call-end-btn');
    const callAnswerBtn = document.getElementById('call-answer-btn');
    
    function initWebRTC() {
        socket.on('incoming_call', (data) => {
            callOverlay.style.display = 'flex';
            callStatus.textContent = 'Входящий звонок';
            callAnswerBtn.style.display = 'inline-block';
            remoteSocketId = data.from;
            window.pendingOffer = data.offer;
        });
        socket.on('call_answered', (data) => { pc.setRemoteDescription(data.answer).then(() => { callStatus.textContent = 'Разговор идёт...'; }); });
        socket.on('ice_candidate', (candidate) => { if (pc) pc.addIceCandidate(new RTCIceCandidate(candidate)); });
        socket.on('call_ended', () => { endCall(); alert('Звонок завершён'); });
    }

    function initiateCall(useVideo) {
        if (!socket) return;
        isCaller = true;
        callOverlay.style.display = 'flex';
        callStatus.textContent = 'Исходящий звонок...';
        callAnswerBtn.style.display = 'none';
        navigator.mediaDevices.getUserMedia({ audio: true, video: useVideo })
            .then(stream => {
                localStream = stream; localVideo.srcObject = stream;
                localVideo.style.display = useVideo ? 'block' : 'none';
                pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' }] });
                stream.getTracks().forEach(track => pc.addTrack(track, stream));
                pc.onicecandidate = (e) => {
                    if (e.candidate && remoteSocketId) socket.emit('ice_candidate', { targetId: remoteSocketId, candidate: e.candidate });
                };
                pc.ontrack = (e) => { remoteVideo.srcObject = e.streams[0]; };
                pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
                    socket.emit('call_user', { targetRoomId: '1', offer: pc.localDescription });
                });
            }).catch(err => { alert('Нет доступа к камере/микрофону'); endCall(); });
    }

    callAnswerBtn.onclick = () => {
        callAnswerBtn.style.display = 'none';
        callStatus.textContent = 'Соединение...';
        navigator.mediaDevices.getUserMedia({ audio: true, video: true })
            .then(stream => {
                localStream = stream; localVideo.srcObject = stream; localVideo.style.display = 'block';
                pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' }] });
                stream.getTracks().forEach(track => pc.addTrack(track, stream));
                pc.onicecandidate = (e) => {
                    if (e.candidate && remoteSocketId) socket.emit('ice_candidate', { targetId: remoteSocketId, candidate: e.candidate });
                };
                pc.ontrack = (e) => { remoteVideo.srcObject = e.streams[0]; };
                pc.setRemoteDescription(window.pendingOffer).then(() => pc.createAnswer()).then(answer => pc.setLocalDescription(answer)).then(() => {
                    socket.emit('answer_call', { targetId: remoteSocketId, answer: pc.localDescription });
                    callStatus.textContent = 'Разговор идёт...';
                });
            }).catch(err => { alert('Ошибка'); endCall(); });
    };
    document.getElementById('audio-call-btn').onclick = () => initiateCall(false);
    document.getElementById('video-call-btn').onclick = () => initiateCall(true);

    function endCall() {
        if (pc) { pc.close(); pc = null; }
        if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
        callOverlay.style.display = 'none';
        localVideo.srcObject = null; remoteVideo.srcObject = null;
        if (socket) socket.emit('hangup', { roomId: '1' });
    }
    callEndBtn.onclick = endCall;

    // Инициализация WebRTC при старте
    initWebRTC();
</script>
</body>
</html>
