<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lingle</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        
        #app-container {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            background: #181818;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        /* --- Экран входа --- */
        #auth-container {
            display: flex;
            flex: 1;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            background: #181818;
        }
        #auth-box {
            width: 100%;
            max-width: 360px;
            background: #222;
            padding: 40px 30px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        #auth-box h2 {
            text-align: center;
            font-weight: 700;
            font-size: 24px;
            color: #fff;
            margin-bottom: 5px;
        }
        #auth-box input {
            background: #2a2a2a;
            border: 1px solid #333;
            padding: 14px 16px;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            width: 100%;
            outline: none;
            transition: border 0.2s;
        }
        #auth-box input:focus { border-color: #6c5ce7; }
        #auth-box button {
            background: #6c5ce7;
            border: none;
            padding: 14px;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
        }
        #auth-box button:hover { background: #5a4bd1; }
        #auth-box .toggle {
            background: transparent;
            color: #999;
            border: none;
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
            transition: color 0.2s;
        }
        #auth-box .toggle:hover { color: #fff; }
        #auth-box .error {
            color: #ff6b6b;
            text-align: center;
            font-size: 14px;
            margin-top: -10px;
        }

        /* --- Экран чатов --- */
        #chat-container {
            display: none;
            flex: 1;
            flex-direction: column;
            height: 100%;
            background: #181818;
        }
        
        /* Верхняя панель */
        #header {
            padding: 12px 16px;
            background: #202020;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a2a2a;
            backdrop-filter: blur(10px);
        }
        #header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #header-left .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #6c5ce7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: #fff;
        }
        #header-left .title {
            font-weight: 600;
            font-size: 18px;
            color: #fff;
        }
        #header-left .subtitle {
            font-size: 13px;
            color: #888;
        }
        #header-right {
            display: flex;
            gap: 10px;
        }
        #header-right button {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 22px;
            padding: 6px;
            cursor: pointer;
            transition: color 0.2s;
        }
        #header-right button:hover { color: #fff; }

        /* Сообщения */
        #messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #181818;
        }
        #messages::-webkit-scrollbar {
            width: 4px;
        }
        #messages::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        .msg {
            display: flex;
            width: 100%;
            margin-bottom: 2px;
        }
        .msg-content {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            position: relative;
            word-wrap: break-word;
            font-size: 15px;
            line-height: 1.5;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .msg.self {
            justify-content: flex-end;
        }
        .msg.self .msg-content {
            background: #6c5ce7;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.other {
            justify-content: flex-start;
        }
        .msg.other .msg-content {
            background: #2a2a2a;
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .msg .username {
            font-weight: 600;
            font-size: 13px;
            color: #6c5ce7;
            display: block;
            margin-bottom: 2px;
        }
        .msg .text {
            word-break: break-word;
        }
        .msg .time {
            font-size: 11px;
            color: #888;
            float: right;
            margin-top: 6px;
            margin-left: 8px;
        }

        /* Поле ввода */
        #input-area {
            display: flex;
            padding: 10px 16px;
            background: #202020;
            gap: 10px;
            align-items: center;
            border-top: 1px solid #2a2a2a;
        }
        #msgInput {
            flex: 1;
            background: #2a2a2a;
            border: none;
            padding: 12px 16px;
            border-radius: 24px;
            color: #fff;
            outline: none;
            font-size: 15px;
            transition: background 0.2s;
        }
        #msgInput:focus { background: #333; }
        #sendBtn {
            background: #6c5ce7;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        #sendBtn:hover { background: #5a4bd1; }

        /* --- Меню чатов --- */
        #rooms-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 10;
            justify-content: center;
            align-items: center;
        }
        #rooms-modal {
            background: #222;
            width: 90%;
            max-width: 400px;
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 80vh;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        #rooms-modal h3 {
            margin: 0;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
        }
        #rooms-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #rooms-list button {
            background: #2a2a2a;
            border: none;
            padding: 14px 16px;
            border-radius: 12px;
            color: #e0e0e0;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #rooms-list button:hover { background: #333; }
        #rooms-list button.active {
            background: #6c5ce7;
            color: #fff;
        }
        #create-room-area {
            display: flex;
            gap: 10px;
            border-top: 1px solid #333;
            padding-top: 16px;
        }
        #create-room-area input {
            flex: 1;
            background: #2a2a2a;
            border: none;
            padding: 12px 16px;
            border-radius: 12px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }
        #create-room-area button {
            background: #6c5ce7;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }
        #create-room-area button:hover { background: #5a4bd1; }
        #close-rooms-btn {
            background: transparent;
            border: none;
            color: #888;
            text-align: center;
            padding: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        #close-rooms-btn:hover { color: #fff; }

        /* --- Звонок --- */
        #call-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 20;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #call-box {
            background: #1a1a1a;
            width: 90%;
            max-width: 400px;
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }
        #call-box video {
            width: 100%;
            max-height: 200px;
            background: #0f0f0f;
            border-radius: 12px;
            object-fit: cover;
        }
        #call-box #local-video {
            width: 100px;
            height: 80px;
            position: absolute;
            bottom: 100px;
            right: 20px;
            border: 2px solid #6c5ce7;
            z-index: 21;
            border-radius: 12px;
            background: #0f0f0f;
        }
        #call-box .call-info {
            font-size: 18px;
            font-weight: 600;
        }
        #call-box .call-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        #call-box .call-buttons button {
            padding: 14px 24px;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #call-box .call-buttons button:hover { transform: scale(1.05); }
        #call-box .btn-end { background: #e74c3c; color: #fff; }
        #call-box .btn-answer { background: #6c5ce7; color: #fff; }
        #call-box .btn-mute { background: #333; color: #fff; border-radius: 12px; padding: 10px 16px; font-size: 16px; }
    </style>
</head>
<body>

<div id="app-container">
    <!-- АВТОРИЗАЦИЯ -->
    <div id="auth-container">
        <div id="auth-box">
            <h2 id="auth-title">Вход в Lingle</h2>
            <input type="text" id="reg-username" placeholder="Имя пользователя" style="display: none;">
            <input type="email" id="auth-email" placeholder="Email">
            <input type="password" id="auth-password" placeholder="Пароль">
            <div class="error" id="auth-error"></div>
            <button id="auth-btn">Войти</button>
            <button class="toggle" id="auth-toggle">Нет аккаунта? Зарегистрироваться</button>
        </div>
    </div>

    <!-- ЧАТЫ -->
    <div id="chat-container">
        <div id="header">
            <div id="header-left">
                <div class="avatar">L</div>
                <div>
                    <div class="title" id="current-room-name">Общий чат</div>
                    <div class="subtitle" id="online-status">Вы вошли как Гость</div>
                </div>
            </div>
            <div id="header-right">
                <button id="audio-call-btn" title="Аудиозвонок">🎧</button>
                <button id="video-call-btn" title="Видеозвонок">📹</button>
                <button id="rooms-btn">📂</button>
            </div>
        </div>

        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="msgInput" placeholder="Сообщение...">
            <button id="sendBtn">➤</button>
        </div>
    </div>

    <!-- ОВЕРЛЕЙ СО СПИСКОМ ЧАТОВ -->
    <div id="rooms-overlay">
        <div id="rooms-modal">
            <h3>Ваши чаты</h3>
            <div id="rooms-list">
                <button class="active" data-id="1">Общий чат</button>
            </div>
            <div id="create-room-area">
                <input type="text" id="new-room-name" placeholder="Название нового чата...">
                <button id="create-room-btn">Создать</button>
            </div>
            <button id="close-rooms-btn">Закрыть</button>
        </div>
    </div>

    <!-- ОВЕРЛЕЙ ДЛЯ ЗВОНКА -->
    <div id="call-overlay">
        <div id="call-box">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
            <div class="call-info" id="call-status">Звонок...</div>
            <div class="call-buttons">
                <button id="call-end-btn" class="btn-end">📞</button>
                <button id="call-answer-btn" class="btn-answer" style="display:none;">✅</button>
                <button id="call-mute-btn" class="btn-mute">🔇</button>
            </div>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    // --- АВТОРИЗАЦИЯ ---
    const authContainer = document.getElementById('auth-container');
    const chatContainer = document.getElementById('chat-container');
    const authTitle = document.getElementById('auth-title');
    const regUsername = document.getElementById('reg-username');
    const authEmail = document.getElementById('auth-email');
    const authPassword = document.getElementById('auth-password');
    const authBtn = document.getElementById('auth-btn');
    const authToggle = document.getElementById('auth-toggle');
    const authError = document.getElementById('auth-error');

    let isLogin = true;
    authToggle.onclick = () => {
        isLogin = !isLogin;
        if (isLogin) {
            authTitle.textContent = 'Вход в Lingle';
            authBtn.textContent = 'Войти';
            regUsername.style.display = 'none';
            authToggle.textContent = 'Нет аккаунта? Зарегистрироваться';
        } else {
            authTitle.textContent = 'Регистрация Lingle';
            authBtn.textContent = 'Зарегистрироваться';
            regUsername.style.display = 'block';
            authToggle.textContent = 'Уже есть аккаунт? Войти';
        }
        authError.textContent = '';
    };

    authBtn.onclick = async () => {
        const email = authEmail.value.trim();
        const password = authPassword.value.trim();
        const username = regUsername.value.trim();
        if (!email || !password) return authError.textContent = 'Заполните почту и пароль!';
        if (!isLogin && !username) return authError.textContent = 'Придумайте имя пользователя!';

        const url = isLogin ? '/api/login' : '/api/register';
        const body = isLogin ? { email, password } : { email, password, username };

        try {
            const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Ошибка');
            localStorage.setItem('token', data.token);
            localStorage.setItem('username', data.user.username);
            startApp(data.user.username);
        } catch (err) {
            authError.textContent = err.message;
        }
    };

    // --- ЛОГИКА ЧАТОВ ---
    let socket = null;
    let currentRoomId = 1;
    let currentRoomName = 'Общий чат';
    const messagesDiv = document.getElementById('messages');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const onlineStatus = document.getElementById('online-status');
    const currentRoomNameEl = document.getElementById('current-room-name');
    const roomsBtn = document.getElementById('rooms-btn');
    const roomsOverlay = document.getElementById('rooms-overlay');
    const roomsList = document.getElementById('rooms-list');
    const closeRoomsBtn = document.getElementById('close-rooms-btn');
    const newRoomName = document.getElementById('new-room-name');
    const createRoomBtn = document.getElementById('create-room-btn');

    function startApp(username) {
        authContainer.style.display = 'none';
        chatContainer.style.display = 'flex';
        onlineStatus.textContent = `Вы вошли как ${username}`;

        const token = localStorage.getItem('token');
        socket = io({ auth: { token } });

        loadRooms();
        joinRoom(1, 'Общий чат');

        socket.on('receive_message', (msg) => {
            addMessage(msg);
        });
    }

    function joinRoom(roomId, roomName) {
        if (!socket) return;
        currentRoomId = roomId;
        currentRoomName = roomName;
        currentRoomNameEl.textContent = roomName;
        messagesDiv.innerHTML = '';
        socket.emit('join_room', roomId);
        socket.once('load_history', (msgs) => {
            msgs.forEach(msg => addMessage(msg));
        });
    }

    function addMessage(msg) {
        const div = document.createElement('div');
        const isSelf = socket && msg.user_id === socket.userId;
        div.className = `msg ${isSelf ? 'self' : 'other'}`;
        let timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        if (msg.time) {
            const date = new Date(msg.time);
            if (!isNaN(date)) timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        div.innerHTML = `
            <div class="msg-content">
                ${!isSelf ? `<span class="username">${msg.username || 'Аноним'}</span>` : ''}
                <div class="text">${msg.text}</div>
                <span class="time">${timeStr}</span>
            </div>
        `;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function sendMessage() {
        const text = msgInput.value.trim();
        if (!text || !socket || !currentRoomId) return;
        socket.emit('send_message', { roomId: currentRoomId, text });
        msgInput.value = '';
    }

    sendBtn.onclick = sendMessage;
    msgInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };

    // --- УПРАВЛЕНИЕ ЧАТАМИ ---
    roomsBtn.onclick = () => { roomsOverlay.style.display = 'flex'; loadRooms(); };
    closeRoomsBtn.onclick = () => { roomsOverlay.style.display = 'none'; };

    async function loadRooms() {
        const token = localStorage.getItem('token');
        try {
            const res = await fetch('/api/rooms', { headers: { 'Authorization': 'Bearer ' + token } });
            const rooms = await res.json();
            renderRoomsList(rooms);
        } catch (err) {
            console.error('Ошибка загрузки чатов:', err);
        }
    }

    function renderRoomsList(rooms) {
        roomsList.innerHTML = '';
        if (rooms.length === 0) {
            roomsList.innerHTML = `<button class="active" data-id="1">Общий чат</button>`;
        } else {
            rooms.forEach(room => {
                const btn = document.createElement('button');
                btn.textContent = room.name;
                btn.dataset.id = room.id;
                if (room.id === currentRoomId) btn.classList.add('active');
                btn.onclick = () => {
                    joinRoom(room.id, room.name);
                    roomsOverlay.style.display = 'none';
                };
                roomsList.appendChild(btn);
            });
        }
    }

    createRoomBtn.onclick = async () => {
        const name = newRoomName.value.trim();
        if (!name) return alert('Введите название!');
        const token = localStorage.getItem('token');
        try {
            const res = await fetch('/api/rooms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ name })
            });
            if (res.ok) {
                newRoomName.value = '';
                loadRooms();
            } else {
                alert('Ошибка создания чата (возможно, такое имя уже есть)');
            }
        } catch (err) {
            alert('Ошибка соединения');
        }
    };

    // --- WEBRTC ЗВОНКИ ---
    const audioCallBtn = document.getElementById('audio-call-btn');
    const videoCallBtn = document.getElementById('video-call-btn');
    const callOverlay = document.getElementById('call-overlay');
    const callStatus = document.getElementById('call-status');
    const localVideo = document.getElementById('local-video');
    const remoteVideo = document.getElementById('remote-video');
    const callEndBtn = document.getElementById('call-end-btn');
    const callAnswerBtn = document.getElementById('call-answer-btn');
    const callMuteBtn = document.getElementById('call-mute-btn');

    let pc = null;
    let localStream = null;
    let isCaller = false;
    let callActive = false;
    let remoteSocketId = null;
    let audioEnabled = true;

    function initiateCall(useVideo) {
        if (!socket || !currentRoomId) return alert('Сначала войдите в чат');
        callOverlay.style.display = 'flex';
        callStatus.textContent = 'Исходящий звонок...';
        callAnswerBtn.style.display = 'none';
        isCaller = true;

        navigator.mediaDevices.getUserMedia({ audio: true, video: useVideo })
            .then(stream => {
                localStream = stream;
                localVideo.srcObject = stream;
                localVideo.style.display = useVideo ? 'block' : 'none';

                pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                stream.getTracks().forEach(track => pc.addTrack(track, stream));

                pc.onicecandidate = (e) => {
                    if (e.candidate && remoteSocketId) {
                        socket.emit('ice_candidate', { targetId: remoteSocketId, candidate: e.candidate });
                    }
                };
                pc.ontrack = (e) => {
                    remoteVideo.srcObject = e.streams[0];
                };

                pc.createOffer()
                    .then(offer => pc.setLocalDescription(offer))
                    .then(() => {
                        socket.emit('call_user', {
                            targetRoomId: currentRoomId,
                            offer: pc.localDescription
                        });
                    });
            })
            .catch(err => {
                alert('Нет доступа к микрофону/камере: ' + err.message);
                endCall();
            });
    }

    socket.on('incoming_call', (data) => {
        if (callActive) return;
        callOverlay.style.display = 'flex';
        callStatus.textContent = `Входящий звонок от ${data.fromUsername}`;
        callAnswerBtn.style.display = 'inline-block';
        isCaller = false;
        remoteSocketId = data.from;
        window.pendingOffer = data.offer;
    });

    callAnswerBtn.onclick = () => {
        callAnswerBtn.style.display = 'none';
        callStatus.textContent = 'Соединение...';

        navigator.mediaDevices.getUserMedia({ audio: true, video: true })
            .then(stream => {
                localStream = stream;
                localVideo.srcObject = stream;
                localVideo.style.display = 'block';

                pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                stream.getTracks().forEach(track => pc.addTrack(track, stream));

                pc.onicecandidate = (e) => {
                    if (e.candidate && remoteSocketId) {
                        socket.emit('ice_candidate', { targetId: remoteSocketId, candidate: e.candidate });
                    }
                };
                pc.ontrack = (e) => {
                    remoteVideo.srcObject = e.streams[0];
                };

                pc.setRemoteDescription(window.pendingOffer)
                    .then(() => pc.createAnswer())
                    .then(answer => pc.setLocalDescription(answer))
                    .then(() => {
                        socket.emit('answer_call', { targetId: remoteSocketId, answer: pc.localDescription });
                        callStatus.textContent = 'Разговор идёт...';
                        callActive = true;
                    });
            })
            .catch(err => {
                alert('Не удалось получить доступ к камере/микрофону');
                endCall();
            });
    };

    socket.on('call_answered', (data) => {
        if (!pc) return;
        pc.setRemoteDescription(data.answer)
            .then(() => {
                callStatus.textContent = 'Разговор идёт...';
                callActive = true;
            });
    });

    socket.on('ice_candidate', (candidate) => {
        if (pc) pc.addIceCandidate(new RTCIceCandidate(candidate));
    });

    function endCall() {
        if (pc) { pc.close(); pc = null; }
        if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
        callActive = false;
        isCaller = false;
        remoteSocketId = null;
        callOverlay.style.display = 'none';
        localVideo.srcObject = null;
        remoteVideo.srcObject = null;
        if (socket && currentRoomId) {
            socket.emit('hangup', { roomId: currentRoomId });
        }
    }

    callEndBtn.onclick = endCall;
    socket.on('call_ended', () => {
        alert('Собеседник завершил звонок');
        endCall();
    });

    audioCallBtn.onclick = () => initiateCall(false);
    videoCallBtn.onclick = () => initiateCall(true);

    callMuteBtn.onclick = () => {
        audioEnabled = !audioEnabled;
        if (localStream) {
            localStream.getAudioTracks().forEach(track => track.enabled = audioEnabled);
        }
        callMuteBtn.textContent = audioEnabled ? '🔇' : '🔊';
    };

    window.onload = () => {
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        if (token && username) {
            startApp(username);
        }
    };
</script>
</body>
</html>
